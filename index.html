<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mealwatch">
  <title>Mealwatch</title>
  <meta name="description" content="Mealwatch -- what's on your plate, before it's on your plate. Recall alerts for your pantry.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://meal.watch">
  <meta property="og:title" content="Mealwatch -- Your pantry, watching your back.">
  <meta property="og:description" content="Recall alerts for what's in your pantry. Brand, product, or barcode -- we'll watch.">
  <meta property="og:url" content="https://meal.watch">
  <meta property="og:type" content="website">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; font-family: Georgia, 'Times New Roman', serif; }
    html, body { height: 100%; overflow-x: hidden; margin: 0; padding: 0; }
    .pantry-bg {
      background-image: url('https://raw.githubusercontent.com/bspencer413/mealwatch-frontend/main/pantry_b2.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: scroll;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const API_BASE = 'https://mealwatch-backend.onrender.com';
const APP_VERSION = '0.1.0';

function App() {
  const [apiVersion, setApiVersion] = useState('...');

  useEffect(function() {
    fetch(API_BASE + '/health')
      .then(function(r) { return r.json(); })
      .then(function(d) { setApiVersion(d.version || '?'); })
      .catch(function() { setApiVersion('offline'); });
  }, []);

  return (
    <div className="pantry-bg min-h-screen flex flex-col items-center justify-between py-12 px-6">
      <div className="flex-1 flex flex-col items-center justify-center text-center w-full">
        <div className="bg-black/60 rounded-2xl p-8 border border-gray-700 max-w-md w-full">
          <h1 className="text-5xl font-bold text-white mb-3 tracking-wide">Mealwatch</h1>
          <p className="text-gray-300 text-xl mb-2">Your pantry, watching your back.</p>
          <p className="text-gray-400 text-sm mt-6">Coming soon</p>
        </div>
      </div>
      <p className="text-gray-300 text-xs bg-black/40 px-3 py-1 rounded-full">
        app v{APP_VERSION} | api v{apiVersion}
      </p>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
